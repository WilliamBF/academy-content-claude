name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from plugin.json
        id: meta
        run: |
          VERSION=$(jq -r .version .claude-plugin/plugin.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "zip_name=content-creation-plugin-v${VERSION}.zip" >> $GITHUB_OUTPUT

      - name: Verify tag matches plugin.json version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION=${{ steps.meta.outputs.version }}
          if [ "$TAG" != "$VERSION" ]; then
            echo "ERROR: Tag v$TAG does not match plugin.json version $VERSION"
            exit 1
          fi

      - name: Build zip
        run: git archive --format=zip HEAD > "${{ steps.meta.outputs.zip_name }}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ steps.meta.outputs.zip_name }}" \
            --title "content-creation-plugin ${{ github.ref_name }}" \
            --generate-notes
